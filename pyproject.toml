[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clawsgo-standalone"
version = "0.1.0"
description = "Native PySide6 desktop rewrite of the ClawsGO application"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
clawsgo-standalone = "main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["gui*"]
